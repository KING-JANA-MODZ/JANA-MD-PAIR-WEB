<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANA MODZ | Ultimate Cyber Pair UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050507;
            color: #e1e1e1;
            overflow-x: hidden;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .red-glow {
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.4);
        }
        .text-glow {
            text-shadow: 0 0 12px rgba(220, 38, 38, 0.8);
        }
        
        /* Rotating Red Line Effect */
        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            margin: 0 auto;
        }
        .profile-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #dc2626, #7f1d1d, transparent 60%, #dc2626);
            animation: rotateBorder 3s linear infinite;
        }
        .profile-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: #09090b;
        }
        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .profile-img {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #dc2626;
        }

        /* Cyber Matrix Canvas */
        #cyberCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Cyber Background Canvas -->
    <canvas id="cyberCanvas"></canvas>

    <!-- Card Container -->
    <div class="bg-zinc-950/90 border border-red-900/50 rounded-2xl p-6 md:p-8 w-full max-w-md text-center shadow-2xl red-glow relative overflow-hidden backdrop-blur-md">
        
        <!-- Live Server Status Badge -->
        <div class="flex justify-between items-center mb-4 text-xs font-orbitron">
            <div class="flex items-center gap-2 bg-zinc-900/80 px-3 py-1 rounded-full border border-zinc-800">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
                <span id="statusText" class="text-gray-400">CHECKING SERVER...</span>
            </div>
            <span id="pingText" class="text-red-500 font-bold">-- ms</span>
        </div>

        <!-- Profile Image with Rotating Red Glow -->
        <div class="profile-container mb-4">
            <img src="https://i.ibb.co/jvs9nKv9/IMG-20260722-WA0028.jpg" alt="JANA MODZ Profile" class="profile-img">
        </div>

        <!-- Header -->
        <h2 class="text-2xl font-black font-orbitron text-white uppercase tracking-wider mb-1">
            JANA <span class="text-red-600 text-glow">MODZ</span> PAIR
        </h2>
        <p class="text-xs text-red-500 font-bold tracking-widest font-orbitron mb-6 uppercase">
            WhatsApp Bot Web Pairing System
        </p>

        <!-- Form Elements -->
        <div class="space-y-4 text-left">
            <label class="text-xs font-bold font-orbitron text-gray-400 block uppercase">
                <i class="fa-solid fa-phone text-red-600 mr-1"></i> Enter Phone Number:
            </label>

            <!-- Country & Phone Number Input Grid -->
            <div class="flex gap-2">
                <input type="text" id="countryCode" readonly 
                    class="w-24 bg-zinc-900/80 border border-zinc-800 text-red-500 font-bold font-orbitron text-center rounded-lg p-3 outline-none cursor-not-allowed">
                
                <input type="text" id="phone" placeholder="771234567" maxlength="10"
                    oninput="validatePhoneInput(this)"
                    class="flex-1 bg-zinc-900/80 border border-zinc-800 focus:border-red-600 text-white font-bold font-orbitron rounded-lg p-3 outline-none transition">
            </div>

            <!-- Error Notice -->
            <p id="validationError" class="text-red-500 text-xs font-orbitron hidden"><i class="fa-solid fa-triangle-exclamation"></i> කරුණාකර නිවැරදි දුරකථන අංකයක් ඇතුළත් කරන්න (ඉලක්කම් 9ක්).</p>

            <!-- Get Code Button -->
            <button onclick="getPairCode()" 
                class="w-full bg-red-700 hover:bg-red-600 text-white font-orbitron font-black py-3 rounded-lg text-sm tracking-widest red-glow transition uppercase flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-bolt"></i> Get Pair Code
            </button>
        </div>

        <!-- Result Container -->
        <div id="result" class="mt-6"></div>

    </div>

    <script>
        const BOT_API_URL = "http://pterocloud.my.id:2009"; 
        let countdownTimer;

        // Audio Effects (Web Audio API)
        function playSound(freq, type, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playClickSound() { playSound(600, 'square', 0.05); }
        function playSuccessSound() { 
            playSound(800, 'sine', 0.1); 
            setTimeout(() => playSound(1200, 'sine', 0.2), 100);
        }

        // Auto Country Code Selection
        async function detectCountryCode() {
            const countryInput = document.getElementById('countryCode');
            countryInput.value = "+Loading";
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                countryInput.value = (data && data.country_calling_code) ? data.country_calling_code : "+94";
            } catch (err) {
                countryInput.value = "+94";
            }
        }

        // Live Server Status & Ping Check
        async function checkServerStatus() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const pingText = document.getElementById('pingText');

            const startTime = performance.now();
            try {
                const res = await fetch(BOT_API_URL, { mode: 'no-cors' });
                const ping = Math.round(performance.now() - startTime);
                
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]";
                statusText.innerText = "SERVER ONLINE";
                statusText.className = "text-emerald-400 font-bold";
                pingText.innerText = `${ping} ms`;
            } catch (err) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
                statusText.innerText = "SERVER OFFLINE";
                statusText.className = "text-red-500 font-bold";
                pingText.innerText = "OFFLINE";
            }
        }

        // Phone Input Validation
        function validatePhoneInput(input) {
            input.value = input.value.replace(/[^0-9]/g, ''); // Numbers only
            const errorElement = document.getElementById('validationError');
            if(input.value.length > 0 && input.value.length < 9) {
                errorElement.classList.remove('hidden');
            } else {
                errorElement.classList.add('hidden');
            }
        }

        // Get Pair Code Function
        async function getPairCode() {
            playClickSound();
            const countryCode = document.getElementById('countryCode').value.replace('+', '').trim();
            let rawPhone = document.getElementById('phone').value.trim().replace(/^0+/, '');
            const resultDiv = document.getElementById('result');

            if (!rawPhone || rawPhone.length < 9) {
                document.getElementById('validationError').classList.remove('hidden');
                return;
            }

            const fullPhone = countryCode + rawPhone;
            resultDiv.innerHTML = `
                <div class="text-gray-400 font-orbitron text-xs animate-pulse py-3">
                    <i class="fa-solid fa-spinner fa-spin text-red-600 mr-2"></i> CONNECTING TO CYBER SYSTEM...
                </div>
            `;

            try {
                const res = await fetch(`${BOT_API_URL}/api/pair?phone=${fullPhone}`);
                const data = await res.json();

                if (data.status) {
                    playSuccessSound();
                    resultDiv.innerHTML = `
                        <div class="bg-zinc-900/90 border border-red-600/60 rounded-lg p-4 mt-2">
                            <span class="text-xs text-gray-400 font-orbitron block mb-1">YOUR PAIR CODE:</span>
                            <div class="text-2xl font-black font-orbitron text-red-500 tracking-widest text-glow mb-1" id="pairCodeText">
                                ${data.code}
                            </div>
                            
                            <!-- Timer -->
                            <div class="text-[11px] text-gray-400 font-orbitron mb-3">
                                Code Expires in: <span id="timer" class="text-red-500 font-bold">60</span>s
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="copyCode('${data.code}')" id="copyBtn" 
                                    class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white font-orbitron text-xs font-bold py-2 px-2 rounded transition flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-copy text-red-500"></i> COPY
                                </button>

                                <a href="https://web.whatsapp.com/" target="_blank" 
                                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-orbitron text-xs font-bold py-2 px-2 rounded transition flex items-center justify-center gap-1">
                                    <i class="fa-brands fa-whatsapp text-lg"></i> OPEN WA
                                </a>
                            </div>
                        </div>
                    `;

                    startTimer(60);
                } else {
                    resultDiv.innerHTML = `<p class="text-red-500 text-xs font-orbitron mt-3">${data.message || 'Error occurred!'}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="text-red-500 text-xs font-orbitron mt-3"><i class="fa-solid fa-triangle-exclamation"></i> Bot API එකට සම්බන්ධ වීමට නොහැකි විය.</p>`;
            }
        }

        // Copy Function
        function copyCode(code) {
            playClickSound();
            navigator.clipboard.writeText(code).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = `<i class="fa-solid fa-check text-green-500"></i> COPIED!`;
                setTimeout(() => {
                    copyBtn.innerHTML = `<i class="fa-solid fa-copy text-red-500"></i> COPY`;
                }, 2000);
            });
        }

        // Countdown Timer
        function startTimer(seconds) {
            clearInterval(countdownTimer);
            let timeLeft = seconds;
            const timerDisplay = document.getElementById('timer');
            
            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timerDisplay) timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    if (timerDisplay) timerDisplay.parentNode.innerText = "CODE EXPIRED!";
                }
            }, 1000);
        }

        // Cyber Matrix Particle Animation Background
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 45 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedY: Math.random() * 1.5 + 0.5,
            opacity: Math.random() * 0.7 + 0.2
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#dc2626';

            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y += p.speedY;
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // Run On Load
        detectCountryCode();
        checkServerStatus();
    </script>
</body>
</html>
